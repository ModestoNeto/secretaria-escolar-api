spring.application.name=secretaria
server.port=3039

# Lê o mesmo .env do Docker Compose (arquivo ignorado pelo Git)
spring.config.import=optional:file:.env[.properties]

spring.datasource.url=jdbc:mysql://127.0.0.1:3309/${DB_NAME}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

management.endpoints.web.exposure.include=health
app.jwt.secret=${JWT_SECRET}
app.jwt.access-minutes=15
app.jwt.refresh-days=7
app.cors.origins=http://localhost:4200
